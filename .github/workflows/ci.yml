name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-service
    env:
      USE_HF_EMBEDDINGS: "0"
      SKIP_KB_STARTUP: "1"
      RAG_LLM_GENERATION_ENABLED: "0"
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            python-ai-service/requirements.txt
            python-ai-service/requirements-dev.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Build deterministic test knowledge base
        run: python -c "from app.services.review_engine import build_knowledge_base; print(build_knowledge_base(reset=True))"

      - name: Run tests with coverage gate
        run: python -m pytest app/tests -q --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60

  spring-build:
    name: Spring Boot build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package Spring Boot service
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  frontend-build:
    name: Vue production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./python-ai-service
          push: false
          tags: policyflow-ai-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
