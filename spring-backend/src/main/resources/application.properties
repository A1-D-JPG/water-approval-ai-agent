server.port=8080
spring.application.name=spring-backend

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/water_approval?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.upload-dir=./uploads
ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}

server.error.include-message=always
